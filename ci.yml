name: Main - CI and Emulated Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all services tests
        run: bash scripts/test.sh

  build:
    name: Docker Build + Health Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t sre-academy-app:${{ github.sha }} .
      - name: Start container
        run: docker run -d --name sre-academy -p 8080:8080 sre-academy-app:${{ github.sha }}
      - name: HTTP health check
        run: |
          for attempt in $(seq 1 20); do
            if bash scripts/smoke.sh http://127.0.0.1:8080; then
              echo 'Container health check passed'
              exit 0
            fi
            sleep 2
          done
          docker logs sre-academy
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f sre-academy || true

  deploy-staging:
    name: Emulated Deployment - Staging
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Simulate staging
        run: |
          echo "Simulating STAGING deployment for commit $GITHUB_SHA"
          echo 'No deployment to an external server is performed.'

  deploy-production:
    name: Emulated Deployment - Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - name: Simulate production
        run: |
          echo "Simulating PRODUCTION deployment for commit $GITHUB_SHA"
          echo 'No deployment to an external server is performed.'
