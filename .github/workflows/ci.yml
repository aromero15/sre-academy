name: SRE Academy - CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-pytest:
    name: Run Python Tests
    runs-on: ubuntu-latest
    needs: [test-calculator]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r app/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: |
          python -m pytest -v
  
  test-lint:
    name: Run PyLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r app/requirements.txt

      - name: Run unit tests
        working-directory: app
        run: |
          pylint app.py
  
  test-calculator:
    name: Run Calculator Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        working-directory: app
        run: |
          python -m unittest test_calculator.py

  deploy-staging:
    name: Deploy to Staging (Simulation)
    runs-on: ubuntu-latest
    needs: test-pytest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Simulate deployment
        run: |
          echo "Deploying to staging..."
          echo "Commit: ${{ github.sha }}"
          echo "Staging deployment completed!"
